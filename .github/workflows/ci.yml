name: GovFriction Lab CI
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test JavaScript analytics and checksum guards
        run: npm test
      - name: Verify static web assets and notebook
        run: npm run build
      - name: Check Python data downloader syntax
        run: python -m py_compile reference/fetch_nyc311.py
      - name: Install statistical reference dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy scikit-learn
      - name: Execute independent predictive Kaggle notebook on synthetic requests
        run: python scripts/smoke_predictive_notebook.py
      - name: Compile real Cloudflare Worker and asset bundle (no deployment)
        run: npx --yes wrangler@4 deploy --dry-run --outdir /tmp/govfriction-worker-check
      - name: Install browser smoke dependencies
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Smoke-test full research web workflow
        run: |
          python -m http.server 8788 --bind 127.0.0.1 > /tmp/govfriction-http.log 2>&1 &
          node scripts/browser_smoke.mjs
